# Denial simulator rules, v0.2 (24 Oct 2026). v0.1 left CO-16 at about 50% of denials and the
# duplicate rule never fired on the real data, so two observable rules were added and the
# duplicate key was tightened. Observable effects were then scaled up (x1.3) to raise the
# learnable signal; the oracle ROC-AUC is printed in the label report. Re-check shares in docs/label_report.txt after each change.
#
# How labels are generated (see simulator/simulate_denials.py):
#   logit(p_denial) = base_logit + sum(effect of every triggered rule) + provider_effect + noise
#   is_denied ~ Bernoulli(p_denial)
#   carc_code = code of the triggered rule with the largest effect (CO-16 if none triggered)
#
# IMPORTANT: this is SIMULATED data. State this clearly in the README.
# `observable: false` rules depend on hidden attributes the model will never see,
# which creates realistic irreducible noise so the model cannot just reverse-engineer the YAML.

version: "0.2"
seed: 42
base_logit: -3.15         # tuned so overall denial rate is roughly 10 percent on toy data
provider_effect_sd: 0.35  # some providers are just worse at billing
noise_sd: 0.30            # claim-level randomness

rules:
  timely_filing:
    carc: "CO-29"
    description: "Claim filed after the payer filing deadline"
    observable: true
    effect: 3.9
    params: {max_days_to_file: 90}

  missing_authorization:
    carc: "CO-197"
    description: "Service needs prior authorization but none on file"
    observable: true
    effect: 3.4
    params: {}

  duplicate_claim:
    carc: "CO-18"
    description: "Same member, provider, service date and procedure already billed"
    observable: true
    effect: 4.2
    params: {}

  coverage_inactive:
    carc: "CO-27"
    description: "Service date after member coverage ended"
    observable: true
    effect: 4.4
    params: {}

  high_amount_review:
    carc: "CO-50"
    description: "High-dollar claim flagged as not medically necessary"
    observable: true
    effect: 1.4
    params: {amount_quantile: 0.95}

  dx_procedure_mismatch:
    carc: "CO-11"
    description: "Diagnosis not consistent with procedure (hidden coding error)"
    observable: false
    effect: 1.8
    params: {rate: 0.04}

  missing_information:
    carc: "CO-16"
    description: "Claim lacks required information (hidden data-entry gap)"
    observable: false
    effect: 1.5
    params: {rate: 0.03}

  missing_procedure_code:
    carc: "CO-4"
    description: "Outpatient or carrier claim with no procedure code (inconsistent or missing code)"
    observable: true
    effect: 1.7
    params: {}

  many_service_lines:
    carc: "CO-97"
    description: "Many service lines on one claim, so some are bundled into another payment"
    observable: true
    effect: 1.3
    params: {min_lines: 6}
